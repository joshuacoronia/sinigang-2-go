<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINIGANG 2 GO | ADMIN STOCKS</title>

    <link rel="stylesheet" href="stock.css">
    <link rel="stylesheet" href="admin-stock.css">
</head>
<body>
    <header class="topheader">
        <h1 style="text-align: center;">SINIGANG 2 GO</h1>

        <div class="staff-info">
        <span id="staffName">Admin: admin</span>
        <button type="button" class="head-button" id="logoutButton">
            Log-out
        </button>
    </div>

    </header>

    <nav class="navbar">
        <a href="admin.html">HOME</a>
        <a href="admin-stock.html" class="active stock-link">STOCKS</a>
        <a href="admin-sales.html">RECORD SALES</a>
        <a href="admin-account.html">ACCOUNT</a>
    </nav>

    <main class="container">
        <div class="page-heading">
            <div>
                <h2>Inventory Management</h2>
            </div>
        </div>

        <div id="stockAlert" class="stock-alert" hidden>
            <strong>!</strong>
            <span id="stockAlertMessage"></span>
        </div>

        <section class="stock-summary">
            <div class="summary-box">
                <p>Total Products</p>
                <h3 id="totalProducts">0</h3>
            </div>
            <div class="summary-box">
                <p>Low Stock</p>
                <h3 id="lowStockCount">0</h3>
            </div>
            <div class="summary-box">
                <p>Out of Stock</p>
                <h3 id="outOfStockCount">0</h3>
            </div>
        </section>

        <section class="stock-section">
            <div class="section-heading">
                <h3>Manage Product Quantities</h3>
            </div>
            <div id="stockGrid" class="stock-grid"></div>
        </section>
    </main>

    <dialog id="logoutDialog" class="modal">
    <div class="modal-content">
        <button
            type="button"
            id="cancelLogoutX"
            class="close-button"
            aria-label="Close"
        >&times;</button>

        <h2>Logging out</h2>
        <p>Are you sure you want to log-out?</p>

        <div class="modal-actions">
            <button type="button" id="cancelLogout">Cancel</button>
            <button type="button" id="confirmLogout">Confirm</button>
        </div>
    </div>
</dialog>

        <script src="page-guard.js"></script>
        <script src="logout.js"></script>
        <script src="session.js"></script>
        <script src="inventory.js"></script>
        <script src="admin-stock.js"></script>
</body>
</html>
